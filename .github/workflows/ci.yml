name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1      # must match terraform var.region
  CLUSTER_NAME: capstone     # must match terraform var.cluster_name

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. TESTS ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.service == 'vote'
        with: { python-version: "3.11" }
      - name: Test vote (install deps + syntax check)
        if: matrix.service == 'vote'
        working-directory: vote
        run: |
          pip install -r requirements.txt
          python -m py_compile app.py

      - uses: actions/setup-node@v4
        if: matrix.service == 'result'
        with: { node-version: "20" }
      - name: Test result (install deps + syntax check)
        if: matrix.service == 'result'
        working-directory: result
        run: |
          npm install --no-audit --no-fund
          node --check server.js

      - name: Test worker (compile)
        if: matrix.service == 'worker'
        working-directory: worker
        run: dotnet build -c Release

  # 2. END-TO-END SMOKE TEST WITH DOCKER COMPOSE -------------------------------
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Cast a vote and check it reaches PostgreSQL
        run: |
          curl -fsS http://localhost:8081 >/dev/null
          curl -fsS -X POST -d "vote=a" http://localhost:8080 >/dev/null
          for i in $(seq 1 30); do
            n=$(docker compose exec -T db psql -U postgres -tAc "select count(*) from votes" 2>/dev/null || echo 0)
            echo "votes in db: $n"
            [ "${n:-0}" -ge 1 ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v

  # 3. BUILD -> TRIVY SCAN -> PUSH (tag = commit SHA) ---------------------------
  build:
    runs-on: ubuntu-latest
    needs: [test, smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally so it can be scanned BEFORE it is pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ghcr.io/${{ env.OWNER }}/voting-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Check https://github.com/aquasecurity/trivy-action/releases and pin the newest release tag.
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/voting-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/${{ env.OWNER }}/voting-${{ matrix.service }}:${{ github.sha }}

  # 4. DEPLOY WITH HELM (main branch only) ----------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write       # lets the job request an OIDC token for AWS
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # output "github_actions_role_arn" from Terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Helm upgrade (auto rolls back if the new pods never become ready)
        run: |
          helm upgrade --install voting helm/voting \
            --namespace voting --create-namespace \
            --set global.registry=ghcr.io/${OWNER} \
            --set vote.image.tag=${GITHUB_SHA} \
            --set result.image.tag=${GITHUB_SHA} \
            --set worker.image.tag=${GITHUB_SHA} \
            --atomic --timeout 5m

      - name: Show result
        run: |
          kubectl get pods -n voting
          kubectl get svc -n voting
          helm history voting -n voting
