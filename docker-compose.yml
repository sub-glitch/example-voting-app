# Replaces the upstream docker-compose.yml. Apps listen on 8080 (non-root cannot bind port 80 reliably).
# Vote UI:   http://localhost:8080
# Result UI: http://localhost:8081
name: voting-app

services:
  vote:
    build: ./vote
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [front-tier, back-tier]

  result:
    build: ./result
    ports: ["8081:8080"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [front-tier, back-tier]

  worker:
    build: ./worker
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    networks: [back-tier]

  redis:
    image: redis:7.4.1-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back-tier]

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # upstream demo credential, hardcoded in the app source
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back-tier]

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
